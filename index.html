<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Al Ghaith Asset Management Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <style>
        body { font-family: 'Inter', sans-serif; }
        .animate-fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between antialiased selection:bg-rose-500 selection:text-white">

    <div id="floating-back-btn" class="hidden fixed bottom-6 right-6 z-50 animate-fade-in">
        <button onclick="returnToHub()" class="flex items-center space-x-2 bg-slate-900/90 text-white hover:bg-rose-600 border border-slate-700 hover:border-rose-500 font-semibold text-xs px-4 py-3 rounded-full shadow-2xl transition-all duration-300 transform hover:scale-105 backdrop-blur-sm cursor-pointer">
            <span class="material-symbols-outlined text-sm">hub</span>
            <span>Switch Portal Menu</span>
        </button>
    </div>

    <div id="hub-view" class="flex-1 flex flex-col justify-center px-4 py-12 sm:px-6 lg:px-8 relative z-10 max-w-5xl mx-auto w-full animate-fade-in">
        
        <div class="text-center mb-12">
            <div class="inline-flex items-center justify-center bg-white p-3 rounded-xl shadow-lg mb-4 transform hover:rotate-3 transition-transform duration-300">
                <img src="alghaithlogo.jpg" alt="Al Ghaith Logo" class="h-14 w-auto object-contain" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNiIgaGVpZ2h0PSIzNiI+PHJlY3Qgd2lkdGg9IjM2IiBoZWlnaHQ9IjM2IiBmaWxsPSIjZTExZDQ4IiB4eT0iMCIgeT0iMCIgcng9IjQiLz48dGV4dCB4PSIxOCIgeT0iMjQiIGZvbnQtZmFtaWx5PSJBcmlhbCIgZm9udC1zaXplPSIyMCIgZmlsbD0id2hpdGUiIHRleHQtYW5jaG9yPSJtaWRkbGUiPkE8L3RleHQ+PC9zdmc+'">
            </div>
            <h1 class="text-2xl sm:text-4xl font-extrabold tracking-tight text-white mb-2">
                Al Ghaith Trading & Industrial Services
            </h1>
            <p class="text-slate-400 font-medium text-sm sm:text-base max-w-xl mx-auto">
                Centralized Enterprise Resource & Asset Management Control Center
            </p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 sm:gap-8 w-full max-w-4xl mx-auto">
            
            <button onclick="openPortal('pump')" class="group relative flex flex-col justify-between text-left bg-slate-800/60 hover:bg-slate-800 border border-slate-700/60 hover:border-slate-600 rounded-2xl p-6 sm:p-8 transition-all duration-300 shadow-xl hover:shadow-2xl hover:-translate-y-1 cursor-pointer overflow-hidden min-h-[220px]">
                <div class="absolute top-0 right-0 p-8 opacity-10 group-hover:opacity-20 transition-opacity duration-300 text-rose-500">
                    <span class="material-symbols-outlined !text-8xl select-none">precision_manufacturing</span>
                </div>
                <div>
                    <div class="h-12 w-12 rounded-xl bg-rose-500/10 text-rose-500 flex items-center justify-center mb-5 group-hover:bg-rose-500 group-hover:text-white transition-all duration-300">
                        <span class="material-symbols-outlined text-2xl font-medium">precision_manufacturing</span>
                    </div>
                    <h2 class="text-xl font-bold text-white tracking-tight mb-2 flex items-center gap-2">
                        <span>High Pressure Pump Portal</span>
                    </h2>
                    <p class="text-xs sm:text-sm text-slate-400 leading-relaxed max-w-[280px] sm:max-w-none">
                        Manage master fleet registries, maintenance work orders, logs, dispatch histories, and technician credentials.
                    </p>
                </div>
                <div class="mt-6 flex items-center text-xs font-semibold text-rose-400 group-hover:text-rose-300 transition-colors">
                    <span>Launch Portal Panel</span>
                    <span class="material-symbols-outlined text-sm ml-1.5 transform group-hover:translate-x-1 transition-transform">arrow_forward</span>
                </div>
            </button>

            <button onclick="openPortal('vehicle')" class="group relative flex flex-col justify-between text-left bg-slate-800/60 hover:bg-slate-800 border border-slate-700/60 hover:border-slate-600 rounded-2xl p-6 sm:p-8 transition-all duration-300 shadow-xl hover:shadow-2xl hover:-translate-y-1 cursor-pointer overflow-hidden min-h-[220px]">
                <div class="absolute top-0 right-0 p-8 opacity-10 group-hover:opacity-20 transition-opacity duration-300 text-sky-500">
                    <span class="material-symbols-outlined !text-8xl select-none">directions_car</span>
                </div>
                <div>
                    <div class="h-12 w-12 rounded-xl bg-sky-500/10 text-sky-500 flex items-center justify-center mb-5 group-hover:bg-sky-50 group-hover:text-white transition-all duration-300">
                        <span class="material-symbols-outlined text-2xl font-medium">directions_car</span>
                    </div>
                    <h2 class="text-xl font-bold text-white tracking-tight mb-2 flex items-center gap-2">
                        <span>Vehicle Management Portal</span>
                    </h2>
                    <p class="text-xs sm:text-sm text-slate-400 leading-relaxed max-w-[280px] sm:max-w-none">
                        Track company vehicles, manage Istimara validities, registration renewals, service maintenance metrics, and operational expenses.
                    </p>
                </div>
                <div class="mt-6 flex items-center text-xs font-semibold text-sky-400 group-hover:text-sky-300 transition-colors">
                    <span>Launch Portal Panel</span>
                    <span class="material-symbols-outlined text-sm ml-1.5 transform group-hover:translate-x-1 transition-transform">arrow_forward</span>
                </div>
            </button>

        </div>
    </div>

    <div id="portal-frame-container" class="hidden fixed inset-0 w-full h-full bg-slate-50 z-40">
        <iframe id="portal-iframe" src="" class="w-full h-full border-0 m-0 p-0 overflow-hidden" allow="autoplay; clipboard-write"></iframe>
    </div>

    <footer id="hub-footer" class="py-6 border-t border-slate-800 text-center text-xs text-slate-500 relative z-10 bg-slate-950/40 w-full">
        <div>&copy; 2026 Al Ghaith Trading & Industrial Services. All Rights Reserved.</div>
        
    </footer>

    <script>
        const config = {
            pump: "nlb - Copy.html",
            vehicle: "Vehicle.html"
        };

        function openPortal(type) {
            const fileTarget = config[type];
            if (!fileTarget) return;

            const hubView = document.getElementById('hub-view');
            const hubFooter = document.getElementById('hub-footer');
            const frameContainer = document.getElementById('portal-frame-container');
            const iframe = document.getElementById('portal-iframe');
            const floatingBtn = document.getElementById('floating-back-btn');

            // Set destination document resource target path 
            iframe.src = fileTarget;

            // Manipulate CSS Display parameters smoothly
            hubView.classList.add('hidden');
            if (hubFooter) hubFooter.classList.add('hidden');
            document.body.classList.remove('bg-slate-900', 'text-slate-100');
            document.body.classList.add('bg-white');

            frameContainer.classList.remove('hidden');
            floatingBtn.classList.remove('hidden');
        }

        function returnToHub() {
            const hubView = document.getElementById('hub-view');
            const hubFooter = document.getElementById('hub-footer');
            const frameContainer = document.getElementById('portal-frame-container');
            const iframe = document.getElementById('portal-iframe');
            const floatingBtn = document.getElementById('floating-back-btn');

            // Terminate frame contents resource pointer allocation
            iframe.src = "";

            // Restore Main Framework Layout display configuration parameters
            frameContainer.classList.add('hidden');
            floatingBtn.classList.add('hidden');

            document.body.classList.remove('bg-white');
            document.body.classList.add('bg-slate-900', 'text-slate-100');
            hubView.classList.remove('hidden');
            if (hubFooter) hubFooter.classList.remove('hidden');
        }
    </script>
</body>
</html>
